#ci for porduct catalog microservice
name: product-catalog-ci

on: 
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: check out the code
      uses: actions/checkout@v4

    - name: set go
      uses: actions/setup-go@v4
      with:
        go-version: 1.20
      
    - name: build the code
      run: | 
        cd src/product-catalog
        go mod download
        go build -o product-catalog-service main.go

    - name: run tests
      run: |
        cd src/product-catalog
        go test ./...

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: check out the code
        uses: actions/checkout@v4

      - name: run go lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./src/product-catalog/...

  Docker-build:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: check out the code
        uses: actions/checkout@v4

      - name: install docker
        uses: docker/setup-buildx-action@v2

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: push to docker hub
        uses: docker/build-push-action@v3
        with:
          context: .
          file: ./src/product-catalog/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}


  update-k8s:
    runs-on: ubuntu-latest
    needs: Docker-build
    steps:
      - name: check out the code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: update tag 
        run: |
            sed -i 's/image: .*/image: ankrish/product-cat:${{github.run_id}}/'kubernetes/productcatalog/deployment.yaml

      - name: commit and push changes
        run: |
          git config --global user.name "ankrish004"
          git config --global user.email "prajapati.ankrish@gmail.com"
          git add kubernetes/productcatalog/deployment.yaml
          git commit -m "Update image tag to ${{github.run_id}}"
          git push origin main