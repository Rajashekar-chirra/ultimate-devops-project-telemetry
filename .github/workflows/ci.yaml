name : github actions workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# this workflow_dispatch means the job we trigger manually from github actions page    
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
# run single command using the runners shell
      - name: one line script
        run: echo hello, world!
# run a set of commands using runners shell
      - name: run a multiple line script
        run: |
          echo add another actions to build,
          echo test, and deploy your project.    
# checkout code from github
      - name: checkout code
        uses: actions/checkout@v4
# install goland version        
      - name: setup golang
        uses: actions/setup-go@v2
        with:
          go-version: ~1.22
      # build the code    
      - name: build
        run: |
          cd /src/product-catalog
          go mod download
          go build -o product-catalog-service main.go
          
      # test the code    
      - name: test
        run: go test src/product-catalog/...
# scan the code with golangci-lint 
  scan:
    runs-on: ubuntu-latest
    steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-go@5
          
       # golangci-lint used for code quality for golang code project
       - name: golangci-lint  # cSpell:ignore golangci
         uses: golangci/golangci-lint-action@v9  # cSpell:ignore golangci
         with:
           version: v2.6
       - name: run test case
         run: |
          cd /src/product-catalog
          go test ./...

  docker:
    runs-on: ubuntu-latest
    needs: [build]    # [build, scan]
    steps:
      - uses: actions/checkout@v4
      - name: docker install
        uses: docker/setup-buildx-action@v3  # cSpell:ignore buildx

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}  # cSpell:ignore DOCKERHUB
          password: ${{ secrets.DOCKERHUB_TOKEN }}  # cSpell:ignore DOCKERHUB

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .    # src/product-catalog
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-catalog:${{ github.run_id }} 

# login to github and pull the code and update k8s images           

  kubernetes:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: checkout the code 
        uses: actions/checkout@v4
        with:
          token: ${{secrets.GIT_TOKEN}}   
      - name: update k8s file with image
        run: |
          sed -i 's/image: .*/image: ${{ secrets.DOCKERHUB_USERNAME }}\/product-catalog:${{ github.run_id }}/' kubernetes/productcatalog/deploy.yaml  # cSpell:ignore productcatalog

      - name: commit push to github
        run: |
          git config --global user.email "maheshjadda123@gmail.com"
          git config --global user.name "Mahesh-J-123"  # cSpell:ignore Mahesh
          git add kubernetes/productcatalog/deploy.yaml
          git commit -m "ci-flow committed"  # cSpell:ignore productcatalog
          git push origin main
        

