

name: product-catalog-ci

on:
    push:
        branches:
            - main


jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Go 1.22
              uses: actions/setup-go@v2
              with:
                  go-version: '1.22'

            - name: Build
              run: |
                cd src/product-catalog
                go mod download 
                go build -o product-catalog-service main.go

            - name: unit tests
              run: go testsrc/product-catalog/...

    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run golangci-lint
              run: | 
                    go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.56.2
                    golangci-lint run src/product-catalog/...


    docker:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Docker 
              uses: docker/setup-buildx-action@v1

            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_HUB_USERNAME }}
                  password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}  

            - name: Docker Push
              uses: docker/build-push-action@v6
              with:
                  context: src/product-catalog
                  file: src/product-catalog/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKER_HUB_USERNAME }}/product-catalog-service:${{ github.run_id }}

    updateK8s:
        runs-on: ubuntu-latest

        needs: docker

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: Update tag in k8s deployment file
              run: |
                    sed -i 's/image: .*/image: ${{ secrets.DOCKER_HUB_USERNAME }}/product-catalog:${{ github.run_id }}/' kubernetes/productcatalog/deployment.yaml

            - name: Commit and Push changes
              run: |
                    git config --global user.name 'Vishnu'
                    git config --global user.email 'vishnuz.anil@gmail.com'
                    git add kubernetes/productcatalog/deployment.yaml
                    git commit -m "[CI]Update product-catalog image tag to ${{ github.run_id }}"
                    git push origin main        